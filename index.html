<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Chopper Truck Router</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            font-size: 16px;
        }
        h1 {
            color: #ff6b35;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            color: #f7b801;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .code-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .code-input {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button.secondary { background: #555; }
        .status {
            text-align: center;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            display: none;
        }
        .status.loading { color: #f7b801; }
        .status.success { color: #2ecc71; }
        .status.error { color: #e74c3c; }
        .status.show { display: block; }
        .results {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .results.show { display: block; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #f7b801;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .truck-badge {
            background: #2ecc71;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .directions {
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }
        .direction-step {
            padding: 12px;
            margin: 8px 0;
            background: #222;
            border-left: 3px solid #ff6b35;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
        }
        .step-num {
            color: #f7b801;
            font-weight: bold;
            margin-right: 8px;
        }
        .hint {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>🚛 Price Chopper Truck Router</h1>

    <div class="card">
        <div class="card-title">Route Entry</div>
        <div class="code-inputs">
            <input type="text" id="origin" class="code-input" placeholder="01">
            <input type="text" id="dest" class="code-input" placeholder="23">
        </div>
        <div class="hint">Store: 01-250 | Warehouse: 505-979</div>
    </div>

    <div class="card">
        <input type="text" id="originName" placeholder="Origin" readonly>
        <input type="text" id="destName" placeholder="Destination" readonly>
    </div>

    <button id="calcBtn">Calculate Truck Route</button>
    <button class="secondary" id="clearBtn">Clear</button>

    <div id="status" class="status"></div>
    <div id="results" class="results"></div>

    <script>
        var API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjhjYjg1NGQ4MGEyNDQ2MDc5OWYyNzdkMzJhZmY4NjgwIiwiaCI6Im11cm11cjY0In0=';

        var locations = {
            '01': {name: 'Store #01 - Eastern Parkway', lat: 42.8142, lng: -73.9396},
            '03': {name: 'Store #03 - Brunswick', lat: 42.7284, lng: -73.6918},
            '06': {name: 'Store #06 - Cooper Street', lat: 43.3095, lng: -73.6440},
            '23': {name: 'Store #23 - Madison Avenue', lat: 42.6736, lng: -73.7761},
            '40': {name: 'Store #40 - Glen Street', lat: 43.0831, lng: -73.7850},
            '111': {name: 'Store #111 - East Greenbush', lat: 42.5989, lng: -73.7423},
            '138': {name: 'Store #138 - New Loudon', lat: 42.7477, lng: -73.7601},
            '548': {name: 'Adirondack Beverages', lat: 42.8250, lng: -73.9680},
            '979': {name: 'ADM Flour/Topco', lat: 42.8864, lng: -78.8784},
            '674': {name: 'Agro Foods', lat: 43.1067, lng: -76.2177},
            '960': {name: 'All Seasonings', lat: 43.0923, lng: -75.6513},
            '718': {name: 'Arctic Glacier', lat: 41.5034, lng: -74.0104}
        };

        var selectedOrigin = null;
        var selectedDest = null;

        document.getElementById('origin').addEventListener('input', function() {
            var code = this.value.padStart(2, '0');
            if (locations[code]) {
                selectedOrigin = code;
                document.getElementById('originName').value = locations[code].name;
                this.style.borderColor = '#2ecc71';
            }
        });

        document.getElementById('dest').addEventListener('input', function() {
            var code = this.value.padStart(2, '0');
            if (locations[code]) {
                selectedDest = code;
                document.getElementById('destName').value = locations[code].name;
                this.style.borderColor = '#2ecc71';
            }
        });

        document.getElementById('calcBtn').addEventListener('click', function() {
            if (!selectedOrigin || !selectedDest) {
                showStatus('Please enter both origin and destination', 'error');
                return;
            }

            showStatus('🚛 Getting truck route...', 'loading');
            getTruckRoute();
        });

        function getTruckRoute() {
            var orig = locations[selectedOrigin];
            var dest = locations[selectedDest];

            var truckHeight = 4.11;
            var truckWidth = 2.59;
            var truckWeight = 36.3;

            var requestBody = {
                coordinates: [
                    [orig.lng, orig.lat],
                    [dest.lng, dest.lat]
                ],
                profile: 'driving-hgv',
                format: 'json',
                instructions: true,
                units: 'mi',
                options: {
                    vehicle_type: 'hgv',
                    profile_params: {
                        restrictions: {
                            height: truckHeight,
                            width: truckWidth,
                            weight: truckWeight
                        }
                    },
                    avoid_features: ['ferries']
                }
            };

            fetch('https://api.openrouteservice.org/v2/directions/driving-hgv', {
                method: 'POST',
                headers: {
                    'Authorization': API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
            .then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(function(data) {
                showStatus('✅ Truck route calculated!', 'success');
                setTimeout(function() {
                    document.getElementById('status').classList.remove('show');
                }, 1500);
                displayTruckRoute(data);
            })
            .catch(function(error) {
                console.error('Error:', error);
                showStatus('❌ Error getting truck route', 'error');
            });
        }

        function displayTruckRoute(data) {
            var route = data.routes[0];
            var miles = (route.summary.distance * 0.621371 / 1000).toFixed(1);
            var mins = Math.round(route.summary.duration / 60);

            var html = '<div class="truck-badge">🚛 TRUCK-OPTIMIZED ROUTE</div>';
            
            html += '<div class="stat-grid">' +
                '<div class="stat"><div class="stat-value">' + miles + '</div><div class="stat-label">Miles</div></div>' +
                '<div class="stat"><div class="stat-value">' + mins + '</div><div class="stat-label">Minutes</div></div>' +
                '</div>';

            html += '<div class="directions">' +
                '<div style="font-weight:bold;margin-bottom:15px;color:#f7b801">🧭 Truck Navigation</div>' +
                '<div style="margin-bottom:10px"><strong>From:</strong> ' + locations[selectedOrigin].name + '</div>' +
                '<div style="margin-bottom:15px"><strong>To:</strong> ' + locations[selectedDest].name + '</div>';

            if (route.segments && route.segments[0] && route.segments[0].steps) {
                route.segments[0].steps.forEach(function(step, i) {
                    if (step.instruction) {
                        var dist = (step.distance * 0.000621371).toFixed(1);
                        html += '<div class="direction-step">' +
                               '<span class="step-num">' + (i + 1) + '.</span>' +
                               step.instruction + ' <span style="color:#888">(' + dist + ' mi)</span>' +
                               '</div>';
                    }
                });
            }

            html += '</div>';

            html += '<div style="background:rgba(46,204,113,0.15);border:1px solid #2ecc71;padding:12px;border-radius:8px;margin-top:15px;font-size:13px;color:#5FD68A">' +
                '✅ This route avoids low bridges, narrow roads, and weight restrictions based on your truck dimensions (13.5\' height, 8.5\' width, 40 tons)' +
                '</div>';

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').classList.add('show');
        }

        function showStatus(message, type) {
            var status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type + ' show';
        }

        document.getElementById('clearBtn').addEventListener('click', function() {
            selectedOrigin = null;
            selectedDest = null;
            document.getElementById('origin').value = '';
            document.getElementById('dest').value = '';
            document.getElementById('originName').value = '';
            document.getElementById('destName').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('status').classList.remove('show');
        });

        console.log('✅ OpenRouteService Truck Router Ready!');
    </script>
</body>
</html>
