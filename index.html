<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Chopper Multi-Stop Router - All Stores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            font-size: 16px;
        }
        h1 {
            color: #ff6b35;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            color: #f7b801;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .stop-input {
            display: grid;
            grid-template-columns: 80px 1fr 40px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .stop-num {
            text-align: center;
            font-weight: bold;
            color: #f7b801;
            font-size: 18px;
        }
        .code-input {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
        }
        .remove-btn {
            width: 40px;
            height: 40px;
            background: #e74c3c;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        button.secondary { background: #555; }
        button.add { background: #2ecc71; }
        .warehouse-badge {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .results {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .results.show { display: block; }
        .route-leg {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ff6b35;
        }
        .route-leg.warehouse { border-left-color: #3498db; }
        .route-leg.smart { border-left-color: #2ecc71; }
        .leg-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            color: #f7b801;
        }
        .pdf-badge {
            background: #2ecc71;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .smart-badge {
            background: #9b59b6;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .highway-badge {
            background: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin: 3px;
        }
        .direction-list {
            background: #222;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        .direction-item {
            padding: 8px 0;
            margin: 5px 0;
            padding-left: 20px;
            position: relative;
            line-height: 1.6;
            font-size: 14px;
        }
        .direction-item:before {
            content: "•";
            color: #f7b801;
            font-weight: bold;
            font-size: 20px;
            position: absolute;
            left: 0;
        }
        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
        .stat {
            font-size: 13px;
            color: #888;
        }
        .stat-value {
            color: #f7b801;
            font-weight: bold;
        }
        .total-stats {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            color: white;
            text-align: center;
        }
        .total-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .hint {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>

    var stops = [];

    function addStop() {
        stops.push(null);
        renderStops();
    }

    function removeStop(index) {
        stops.splice(index, 1);
        renderStops();
    }

    function renderStops() {
        var html = '';
        stops.forEach(function(stop, i) {
            html += '<div class="stop-input">' +
                   '<div class="stop-num">STOP ' + (i + 1) + '</div>' +
                   '<input type="text" class="code-input" placeholder="Code" maxlength="3" ' +
                   'value="' + (stop || '') + '" onchange="updateStop(' + i + ', this.value)">' +
                   '<button class="remove-btn" onclick="removeStop(' + i + ')">×</button>' +
                   '</div>';
        });
        document.getElementById('stopsList').innerHTML = html;
    }

    function updateStop(index, value) {
        var code = value.padStart(2, '0');
        if (locations[code]) {
            stops[index] = code;
        }
    }

    function calculateRoute() {
        var validStops = stops.filter(function(s) { return s && locations[s]; });
        
        if (validStops.length === 0) {
            alert('Please add at least one stop');
            return;
        }

        var routeData = [];
        var totalMiles = 0;

        // LEG 1: Warehouse to First Stop
        var firstStop = locations[validStops[0]];
        var leg1Miles = parseFloat(estimateDistance(WAREHOUSE.lat, WAREHOUSE.lng, firstStop.lat, firstStop.lng));
        totalMiles += leg1Miles;

        routeData.push({
            type: 'warehouse-to-store',
            from: 'Warehouse',
            to: firstStop.name,
            directions: firstStop.pdfDirections,
            highways: firstStop.highways,
            miles: leg1Miles.toFixed(1)
        });

        // MIDDLE LEGS: Store to Store (AUTO-CALCULATED)
        for (var i = 0; i < validStops.length - 1; i++) {
            var fromStore = locations[validStops[i]];
            var toStore = locations[validStops[i + 1]];
            var legMiles = parseFloat(estimateDistance(fromStore.lat, fromStore.lng, toStore.lat, toStore.lng));
            totalMiles += legMiles;

            var smartRoute = generateSmartRoute(fromStore, toStore);
            routeData.push({
                type: 'store-to-store',
                from: fromStore.name,
                to: toStore.name,
                directions: smartRoute.directions,
                highway: smartRoute.highway,
                miles: legMiles.toFixed(1)
            });
        }

        // LAST LEG: Return to Warehouse
        var lastStop = locations[validStops[validStops.length - 1]];
        var lastMiles = parseFloat(estimateDistance(lastStop.lat, lastStop.lng, WAREHOUSE.lat, WAREHOUSE.lng));
        totalMiles += lastMiles;

        routeData.push({
            type: 'store-to-warehouse',
            from: lastStop.name,
            to: 'Warehouse',
            directions: reverseDirections(lastStop.pdfDirections),
            miles: lastMiles.toFixed(1)
        });

        displayRoute(routeData, totalMiles);
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
        lat1 = lat1 * Math.PI / 180;
        lon1 = lon1 * Math.PI / 180;
        lat2 = lat2 * Math.PI / 180;
        lon2 = lon2 * Math.PI / 180;
        
        var dlon = lon2 - lon1;
        var x = Math.sin(dlon) * Math.cos(lat2);
        var y = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dlon);
        
        var bearing = Math.atan2(x, y);
        bearing = bearing * 180 / Math.PI;
        bearing = (bearing + 360) % 360;
        
        return bearing;
    }

    function getDirection(bearing) {
        var directions = ['North', 'Northeast', 'East', 'Southeast', 'South', 'Southwest', 'West', 'Northwest'];
        var index = Math.round(bearing / 45) % 8;
        return directions[index];
    }

    function generateSmartRoute(fromStore, toStore) {
        var fromHighways = fromStore.highways || [];
        var toHighways = toStore.highways || [];
        
        // Filter out Route 7 - focus on major highways
        var majorHighways = ['I-90', 'I-87', 'I-88', 'I-84', 'I-890', 'I-190', 'Route 4', 'Route 9', 'Route 20'];
        var fromMajor = fromHighways.filter(function(h) { 
            return h !== 'Route 7' && majorHighways.indexOf(h) >= 0; 
        });
        var toMajor = toHighways.filter(function(h) { 
            return h !== 'Route 7' && majorHighways.indexOf(h) >= 0; 
        });
        
        // Find common major highways
        var common = fromMajor.filter(function(h) { return toMajor.indexOf(h) >= 0; });
        
        if (common.length > 0) {
            // Prefer I-90, then I-87, then others
            var preferred = ['I-90', 'I-87', 'I-88', 'I-84'];
            var bestHighway = common[0];
            for (var i = 0; i < preferred.length; i++) {
                if (common.indexOf(preferred[i]) >= 0) {
                    bestHighway = preferred[i];
                    break;
                }
            }
            return {
                highway: bestHighway,
                directions: [
                    'Follow ' + bestHighway + ' toward destination',
                    'Use navigation app for final approach to store'
                ]
            };
        }
        
        // No common highway - smart connector based on geography
        var bearing = calculateBearing(fromStore.lat, fromStore.lng, toStore.lat, toStore.lng);
        var direction = getDirection(bearing);
        var connector = '';
        var mainHighway = '';
        
        if (direction.indexOf('North') >= 0) {
            if (toMajor.indexOf('I-87') >= 0) {
                mainHighway = 'I-87 North';
                connector = fromMajor.indexOf('I-90') >= 0 ? 'Continue on I-90 to I-87 North' : 'Take I-90 to I-87 North';
            } else {
                mainHighway = 'I-90';
                connector = 'Head north on I-90';
            }
        } else if (direction.indexOf('South') >= 0) {
            mainHighway = 'I-87 South';
            connector = fromMajor.indexOf('I-90') >= 0 ? 'Take I-90 to I-87 South' : 'Head south on I-87';
        } else if (direction.indexOf('West') >= 0) {
            if (toMajor.indexOf('I-88') >= 0) {
                mainHighway = 'I-88 West';
                connector = 'Take I-90 West to I-88 West';
            } else {
                mainHighway = 'I-90 West';
                connector = 'Take I-90 West';
            }
        } else {
            mainHighway = 'I-90 East';
            connector = 'Take I-90 East';
        }
        
        return {
            highway: mainHighway,
            directions: [
                connector,
                'Head ' + direction.toLowerCase() + ' toward destination',
                'Use navigation app for final approach'
            ]
        };
    }

    function reverseDirections(directions) {
        if (!Array.isArray(directions)) return ['Return via reverse route'];
        
        var reversed = [];
        for (var i = directions.length - 1; i >= 0; i--) {
            var step = directions[i];
            step = step.replace(/Left/gi, 'TEMP_RIGHT')
                      .replace(/Right/gi, 'Left')
                      .replace(/TEMP_RIGHT/g, 'Right');
            step = step.replace(/East/gi, 'TEMP_WEST')
                      .replace(/West/gi, 'East')
                      .replace(/TEMP_WEST/g, 'West');
            step = step.replace(/North/gi, 'TEMP_SOUTH')
                      .replace(/South/gi, 'North')
                      .replace(/TEMP_SOUTH/g, 'South');
            reversed.push(step);
        }
        return reversed;
    }

    function displayRoute(routeData, totalMiles) {
        var totalMins = Math.round((totalMiles / 50) * 60);

        var html = '<div class="total-stats">' +
            '<div>TOTAL ROUTE</div>' +
            '<div class="total-value">' + totalMiles.toFixed(1) + ' mi</div>' +
            '<div>' + Math.floor(totalMins / 60) + 'h ' + (totalMins % 60) + 'm</div>' +
            '</div>';

        routeData.forEach(function(leg, i) {
            var legClass = leg.type.includes('warehouse') ? 'warehouse' : 'smart';
            var badge = leg.type === 'store-to-store' ? 
                       '<span class="smart-badge">AUTO-CALCULATED</span>' : 
                       '<span class="pdf-badge">PDF DIRECTIONS</span>';
            
            if (leg.highway) {
                badge += ' <span class="highway-badge">' + leg.highway + '</span>';
            }

            html += '<div class="route-leg ' + legClass + '">' +
                   '<div class="leg-header">LEG ' + (i + 1) + ': ' + leg.from + ' → ' + leg.to + '</div>' +
                   badge;

            if (leg.highways && leg.highways.length > 0) {
                html += '<div style="margin:10px 0">';
                leg.highways.forEach(function(hw) {
                    html += '<span class="highway-badge">' + hw + '</span>';
                });
                html += '</div>';
            }

            html += '<div class="direction-list">';
            if (Array.isArray(leg.directions)) {
                leg.directions.forEach(function(dir) {
                    html += '<div class="direction-item">' + dir + '</div>';
                });
            } else {
                html += '<div class="direction-item">' + leg.directions + '</div>';
            }
            html += '</div>';

            var time = Math.round((parseFloat(leg.miles) / 50) * 60);
            html += '<div class="stat-row">' +
                   '<div class="stat">Distance: <span class="stat-value">' + leg.miles + ' mi</span></div>' +
                   '<div class="stat">Time: <span class="stat-value">~' + time + ' min</span></div>' +
                   '</div></div>';
        });

        document.getElementById('results').innerHTML = html;
        document.getElementById('results').classList.add('show');
    }

    function estimateDistance(lat1, lng1, lat2, lng2) {
        var R = 3959;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lng2 - lng1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return (R * c * 1.25).toFixed(1);
    }

    function clearRoute() {
        stops = [];
        renderStops();
        document.getElementById('results').classList.remove('show');
    }

    addStop();
    console.log('✅ Complete Router Ready - 107 stores loaded!');
</script>
