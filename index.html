<div class="panel top-panel">
    <h1>🚛 Truck Router</h1>
    <label>FROM STORE</label>
    <input type="text" id="fromStore" placeholder="Store # (e.g., 23)">
    <label>TO STORE</label>
    <input type="text" id="toStore" placeholder="Store # (e.g., 111)">
    <button onclick="calculateRoute()">Get Truck Directions</button>
    
    <div id="directions" class="directions"></div>
</div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    
    const WH = {lat: 42.7942, lng: -74.0626, name: 'Warehouse'};
    
    const stores = {
        '01': {name: 'EASTERN PARKWAY', lat: 42.8142, lng: -73.9396},
        '03': {name: 'BRUNSWICK', lat: 42.7284, lng: -73.6918},
        '23': {name: 'MADISON AVENUE', lat: 42.6736, lng: -73.7761},
        '40': {name: 'GLEN STREET', lat: 43.0831, lng: -73.785},
        '111': {name: 'EAST GREENBUSH', lat: 42.5989, lng: -73.7423},
        '138': {name: 'NEW LOUDON', lat: 42.7477, lng: -73.7601},
        '158': {name: 'SARATOGA', lat: 43.08, lng: -73.78}
    };

    let zoom = 9;
    let centerLat = 42.8;
    let centerLng = -73.8;
    let currentRoute = null;
    let mapTiles = {};

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }

    function latLngToXY(lat, lng) {
        const scale = Math.pow(2, zoom) * 256 / (2 * Math.PI);
        const x = (lng - centerLng) * scale * Math.cos(centerLat * Math.PI / 180) + canvas.width / 2;
        const y = (centerLat - lat) * scale + canvas.height / 2;
        return {x, y};
    }

    async function loadMapTile(x, y, z) {
        const key = `${z}/${x}/${y}`;
        if (mapTiles[key]) return mapTiles[key];
        
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
        
        return new Promise((resolve) => {
            img.onload = () => {
                mapTiles[key] = img;
                resolve(img);
            };
            img.onerror = () => resolve(null);
        });
    }

    async function draw() {
        ctx.fillStyle = '#e5e3df';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw map tiles
        const z = Math.floor(zoom);
        const tilesNeeded = Math.ceil(canvas.width / 256) + 1;
        const centerTileX = Math.floor((centerLng + 180) / 360 * Math.pow(2, z));
        const centerTileY = Math.floor((1 - Math.log(Math.tan(centerLat * Math.PI / 180) + 1 / Math.cos(centerLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
        
        for (let tx = centerTileX - tilesNeeded; tx <= centerTileX + tilesNeeded; tx++) {
            for (let ty = centerTileY - tilesNeeded; ty <= centerTileY + tilesNeeded; ty++) {
                const tile = await loadMapTile(tx, ty, z);
                if (tile) {
                    const pos = latLngToXY(
                        Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / Math.pow(2, z)))) * 180 / Math.PI,
                        tx / Math.pow(2, z) * 360 - 180
                    );
                    ctx.drawImage(tile, pos.x, pos.y, 256, 256);
                }
            }
        }
        
        // Route line
        if (currentRoute && currentRoute.path) {
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            currentRoute.path.forEach((point, i) => {
                const pos = latLngToXY(point[0], point[1]);
                if (i === 0) ctx.moveTo(pos.x, pos.y);
                else ctx.lineTo(pos.x, pos.y);
            });
            ctx.stroke();
        }
        
        // Warehouse
        const whPos = latLngToXY(WH.lat, WH.lng);
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.arc(whPos.x, whPos.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Stores
        Object.keys(stores).forEach(code => {
            const store = stores[code];
            const pos = latLngToXY(store.lat, store.lng);
            
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#000';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(code, pos.x, pos.y + 3);
        });
    }

    async function calculateRoute() {
        const fromCode = document.getElementById('fromStore').value.trim().padStart(2, '0');
        const toCode = document.getElementById('toStore').value.trim().padStart(2, '0');
        
        if (!stores[fromCode] || !stores[toCode]) {
            alert('Invalid store codes');
            return;
        }
        
        const from = stores[fromCode];
        const to = stores[toCode];
        
        document.getElementById('directions').innerHTML = '<div class="loading">🚛 Calculating truck route...</div>';
        document.getElementById('directions').classList.add('show');
        
        try {
            // Call Valhalla for truck routing
            const url = `https://valhalla1.openstreetmap.de/route?json={"locations":[{"lat":${from.lat},"lon":${from.lng}},{"lat":${to.lat},"lon":${to.lng}}],"costing":"truck","costing_options":{"truck":{"height":4.0,"width":2.6,"weight":26.0}}}`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.trip && data.trip.legs && data.trip.legs[0]) {
                const leg = data.trip.legs[0];
                const miles = (leg.summary.length * 0.621371).toFixed(1);
                const mins = Math.round(leg.summary.time / 60);
                
                // Decode route path
                const path = decodePolyline(leg.shape);
                currentRoute = {from, to, path};
                
                // Display turn-by-turn
                let html = `
                    <div style="font-weight:600;margin-bottom:10px;color:#2ecc71;">✅ Truck Route Found</div>
                    <div class="stat">
                        <span>From:</span>
                        <span class="stat-value">Store #${fromCode}</span>
                    </div>
                    <div class="stat">
                        <span>To:</span>
                        <span class="stat-value">Store #${toCode}</span>
                    </div>
                    <div class="stat">
                        <span>Distance:</span>
                        <span class="stat-value">${miles} miles</span>
                    </div>
                    <div class="stat">
                        <span>Time:</span>
                        <span class="stat-value">~${mins} min</span>
                    </div>
                    <div style="margin-top:15px;font-weight:600;color:#f7b801;">Turn-by-Turn:</div>
                `;
                
                leg.maneuvers.forEach(m => {
                    html += `<div class="direction-item">${m.instruction}</div>`;
                });
                
                document.getElementById('directions').innerHTML = html;
                
                // Zoom to route
                const bounds = path.reduce((b, p) => ({
                    minLat: Math.min(b.minLat, p[0]),
                    maxLat: Math.max(b.maxLat, p[0]),
                    minLng: Math.min(b.minLng, p[1]),
                    maxLng: Math.max(b.maxLng, p[1])
                }), {minLat: 90, maxLat: -90, minLng: 180, maxLng: -180});
                
                centerLat = (bounds.minLat + bounds.maxLat) / 2;
                centerLng = (bounds.minLng + bounds.maxLng) / 2;
                
                draw();
            } else {
                throw new Error('No route found');
            }
        } catch (error) {
            document.getElementById('directions').innerHTML = `
                <div style="color:#e74c3c;">⚠️ Truck routing unavailable</div>
                <div style="margin-top:10px;font-size:12px;">Use Google Maps or OsmAnd for navigation</div>
            `;
        }
    }

    function decodePolyline(str) {
        const coords = [];
        let lat = 0, lng = 0, index = 0;
        
        while (index < str.length) {
            let b, shift = 0, result = 0;
            do {
                b = str.charCodeAt(index++) - 63;
                result |= (b & 0x1f) << shift;
                shift += 5;
            } while (b >= 0x20);
            lat += (result & 1) ? ~(result >> 1) : (result >> 1);
            
            shift = 0; result = 0;
            do {
                b = str.charCodeAt(index++) - 63;
                result |= (b & 0x1f) << shift;
                shift += 5;
            } while (b >= 0x20);
            lng += (result & 1) ? ~(result >> 1) : (result >> 1);
            
            coords.push([lat / 1e6, lng / 1e6]);
        }
        
        return coords;
    }

    // Mouse controls
    let isDragging = false;
    let lastX, lastY;

    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            const scale = Math.pow(2, zoom) * 256 / (2 * Math.PI);
            centerLng -= dx / (scale * Math.cos(centerLat * Math.PI / 180));
            centerLat += dy / scale;
            lastX = e.clientX;
            lastY = e.clientY;
            draw();
        }
    });

    canvas.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoom += e.deltaY < 0 ? 0.1 : -0.1;
        zoom = Math.max(8, Math.min(15, zoom));
        draw();
    });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
        resizeCanvas();
        console.log('✅ Truck Router loaded with real map tiles!');
    });
</script>
