<html>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { 
            color: #ff6b35;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #f7b801;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        label { 
            display: block;
            color: #f7b801;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input { 
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        button { 
            width: 100%;
            padding: 18px;
            background: #ff6b35;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active { 
            transform: scale(0.98);
            background: #ff8c42;
        }
        .result {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .success {
            color: #2ecc71;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .error {
            color: #e74c3c;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .loading {
            color: #f7b801;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 15px;
        }
        .stat:last-child {
            border-bottom: none;
        }
        .stat-value {
            color: #f7b801;
            font-weight: 600;
        }
        .directions {
            margin-top: 25px;
        }
        .directions-title {
            color: #ff6b35;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .direction-item {
            padding: 12px 0 12px 25px;
            position: relative;
            line-height: 1.6;
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }
        .direction-item:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ff6b35;
            font-weight: bold;
            font-size: 18px;
        }
        .server-status {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid #2ecc71;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2ecc71;
        }
    </style>
</head>

        async function getRoute() {
            const fromCode = String(document.getElementById('fromStore').value).padStart(2, '0');
            const toCode = String(document.getElementById('toStore').value).padStart(2, '0');
            const resultDiv = document.getElementById('result');
            
            if (!stores[fromCode] || !stores[toCode]) {
                resultDiv.innerHTML = '<div class="result"><div class="error">❌ Invalid store codes. Please enter valid store numbers.</div></div>';
                return;
            }
            
            const from = stores[fromCode];
            const to = stores[toCode];
            
            resultDiv.innerHTML = '<div class="result"><div class="loading">🚛 Calculating truck route...</div></div>';
            
            try {
                const response = await fetch('http://192.241.154.246/route', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        locations: [
                            {lat: from.lat, lon: from.lng},
                            {lat: to.lat, lon: to.lng}
                        ],
                        costing: 'truck',
                        costing_options: {
                            truck: {
                                height: 4.0,
                                width: 2.6,
                                weight: 26.0
                            }
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.trip && data.trip.legs && data.trip.legs[0]) {
                    const leg = data.trip.legs[0];
                    const miles = (leg.summary.length * 0.621371).toFixed(1);
                    const mins = Math.round(leg.summary.time / 60);
                    
                    let html = `<div class="result">
                        <div class="success">✅ Truck Route Found</div>
                        <div class="stat"><span>From:</span><span class="stat-value">${from.name} (#${fromCode})</span></div>
                        <div class="stat"><span>To:</span><span class="stat-value">${to.name} (#${toCode})</span></div>
                        <div class="stat"><span>Distance:</span><span class="stat-value">${miles} miles</span></div>
                        <div class="stat"><span>Time:</span><span class="stat-value">~${mins} minutes</span></div>
                        <div class="directions">
                            <div class="directions-title">Turn-by-Turn Directions:</div>`;
                    
                    leg.maneuvers.forEach(m => {
                        html += `<div class="direction-item">${m.instruction}</div>`;
                    });
                    
                    html += '</div></div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<div class="result"><div class="error">❌ No route found</div></div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result">
                    <div class="error">❌ Server Unavailable</div>
                    <div style="color:rgba(255,255,255,0.7);font-size:14px;line-height:1.6;">
                        Could not connect to your routing server. Error: ${error.message}
                    </div>
                </div>`;
            }
        }
        
        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getRoute();
        });
