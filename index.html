<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truck Router Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            font-size: 16px;
        }
        h1 {
            color: #ff6b35;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            color: #f7b801;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 16px;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .code-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .code-input {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background: #d85a2b;
            transform: scale(0.98);
        }
        button.secondary {
            background: #555;
        }
        .status {
            text-align: center;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .status.loading {
            color: #f7b801;
        }
        .status.success {
            color: #2ecc71;
        }
        .status.error {
            color: #e74c3c;
        }
        .results {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .results.show {
            display: block;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #f7b801;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .directions {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .direction-step {
            padding: 12px;
            margin: 8px 0;
            background: #222;
            border-left: 3px solid #ff6b35;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
        }
        .step-num {
            color: #f7b801;
            font-weight: bold;
            margin-right: 8px;
        }
        .warning {
            background: rgba(243,156,18,0.2);
            border: 2px solid #f39c12;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #fdb44b;
        }
        .hint {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>🚛 Truck Router</h1>

    <div class="card">
        <div class="card-title">Quick Route Entry</div>
        <div class="code-inputs">
            <input type="text" id="origin" class="code-input" placeholder="01" maxlength="3" inputmode="numeric">
            <input type="text" id="dest" class="code-input" placeholder="23" maxlength="3" inputmode="numeric">
        </div>
        <div class="hint">Store: 01-250 | Warehouse: 505-979</div>
    </div>

    <div class="card">
        <div class="card-title">Selected Locations</div>
        <input type="text" id="originName" placeholder="Origin" readonly>
        <input type="text" id="destName" placeholder="Destination" readonly>
    </div>

    <button id="calcBtn">Calculate Route</button>
    <button class="secondary" id="clearBtn">Clear</button>

    <div id="status" class="status" style="display: none;"></div>

    <div id="results" class="results"></div>

    <script>
        console.log('🚀 Mobile Truck Router Starting...');

        // Location data
        var locations = {
            '01': {name: 'Store #01 - Eastern Parkway', city: 'Schenectady, NY', lat: 42.8142, lng: -73.9396},
            '03': {name: 'Store #03 - Brunswick', city: 'Troy, NY', lat: 42.7284, lng: -73.6918},
            '06': {name: 'Store #06 - Cooper Street', city: 'Glens Falls, NY', lat: 43.3095, lng: -73.6440},
            '23': {name: 'Store #23 - Madison Avenue', city: 'Albany, NY', lat: 42.6736, lng: -73.7761},
            '40': {name: 'Store #40 - Glen Street', city: 'Saratoga Springs, NY', lat: 43.0831, lng: -73.7850},
            '111': {name: 'Store #111 - East Greenbush', city: 'Rensselaer, NY', lat: 42.5989, lng: -73.7423},
            '138': {name: 'Store #138 - New Loudon', city: 'Latham, NY', lat: 42.7477, lng: -73.7601},
            '548': {name: 'Adirondack Beverages', city: 'Scotia, NY', lat: 42.8250, lng: -73.9680},
            '979': {name: 'ADM Flour/Topco', city: 'Buffalo, NY', lat: 42.8864, lng: -78.8784},
            '674': {name: 'Agro Foods', city: 'Liverpool, NY', lat: 43.1067, lng: -76.2177},
            '960': {name: 'All Seasonings', city: 'Oneida, NY', lat: 43.0923, lng: -75.6513},
            '718': {name: 'Arctic Glacier', city: 'Newburgh, NY', lat: 41.5034, lng: -74.0104}
        };

        var selectedOrigin = null;
        var selectedDest = null;

        // Input handlers
        document.getElementById('origin').addEventListener('input', function() {
            var code = this.value.padStart(2, '0');
            if (locations[code]) {
                selectedOrigin = locations[code];
                document.getElementById('originName').value = locations[code].name;
                this.style.borderColor = '#2ecc71';
                setTimeout(function() {
                    document.getElementById('origin').style.borderColor = '#555';
                }, 1000);
            }
        });

        document.getElementById('dest').addEventListener('input', function() {
            var code = this.value.padStart(2, '0');
            if (locations[code]) {
                selectedDest = locations[code];
                document.getElementById('destName').value = locations[code].name;
                this.style.borderColor = '#2ecc71';
                setTimeout(function() {
                    document.getElementById('dest').style.borderColor = '#555';
                }, 1000);
            }
        });

        // Calculate button
        document.getElementById('calcBtn').addEventListener('click', function() {
            console.log('Calculate clicked');
            
            if (!selectedOrigin || !selectedDest) {
                showStatus('Please enter both origin and destination codes', 'error');
                return;
            }

            showStatus('Trying OSRM routing service...', 'loading');
            
            // Try OSRM
            tryOSRM();
        });

        function tryOSRM() {
            var url = 'https://router.project-osrm.org/route/v1/driving/' +
                     selectedOrigin.lng + ',' + selectedOrigin.lat + ';' +
                     selectedDest.lng + ',' + selectedDest.lat +
                     '?overview=false&steps=true';

            console.log('Calling OSRM:', url);

            fetch(url)
                .then(function(response) {
                    console.log('OSRM Response:', response);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    console.log('OSRM Data:', data);
                    if (data.code === 'Ok') {
                        showStatus('✅ OSRM Connected! Getting directions...', 'success');
                        displayOSRMRoute(data.routes[0]);
                    } else {
                        throw new Error('OSRM: ' + data.code);
                    }
                })
                .catch(function(error) {
                    console.log('OSRM Failed:', error);
                    showStatus('OSRM unavailable - Using estimate', 'error');
                    setTimeout(function() {
                        displayEstimate();
                    }, 1500);
                });
        }

        function displayOSRMRoute(route) {
            var miles = (route.distance / 1609.34).toFixed(1);
            var minutes = Math.round(route.duration / 60);

            var html = '<div class="stat-grid">' +
                      '<div class="stat"><div class="stat-value">' + miles + '</div><div class="stat-label">Miles</div></div>' +
                      '<div class="stat"><div class="stat-value">' + minutes + '</div><div class="stat-label">Minutes</div></div>' +
                      '</div>';

            html += '<div class="directions">';
            html += '<div style="font-weight: bold; margin-bottom: 15px; color: #f7b801;">🧭 Turn-by-Turn Directions</div>';
            html += '<div style="margin-bottom: 10px;"><strong>From:</strong> ' + selectedOrigin.name + '</div>';
            html += '<div style="margin-bottom: 15px;"><strong>To:</strong> ' + selectedDest.name + '</div>';

            route.legs[0].steps.forEach(function(step, i) {
                var dist = (step.distance / 1609.34).toFixed(1);
                html += '<div class="direction-step">' +
                       '<span class="step-num">' + (i + 1) + '.</span>' +
                       step.maneuver.instruction + ' <span style="color: #888;">(' + dist + ' mi)</span>' +
                       '</div>';
            });

            html += '</div>';

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').classList.add('show');
            document.getElementById('status').style.display = 'none';
        }

        function displayEstimate() {
            // Calculate straight-line distance
            var R = 3959;
            var lat1 = selectedOrigin.lat * Math.PI / 180;
            var lat2 = selectedDest.lat * Math.PI / 180;
            var dLat = (selectedDest.lat - selectedOrigin.lat) * Math.PI / 180;
            var dLon = (selectedDest.lng - selectedOrigin.lng) * Math.PI / 180;
            
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1) * Math.cos(lat2) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            var distance = R * c;
            
            var roadMiles = (distance * 1.3).toFixed(1);
            var minutes = Math.round((roadMiles / 55) * 60);

            var html = '<div class="stat-grid">' +
                      '<div class="stat"><div class="stat-value">~' + roadMiles + '</div><div class="stat-label">Miles (Est)</div></div>' +
                      '<div class="stat"><div class="stat-value">~' + minutes + '</div><div class="stat-label">Minutes</div></div>' +
                      '</div>';

            html += '<div class="directions">';
            html += '<div style="font-weight: bold; margin-bottom: 10px;">📍 Estimated Route</div>';
            html += '<div style="margin-bottom: 10px;"><strong>From:</strong> ' + selectedOrigin.name + '</div>';
            html += '<div style="margin-bottom: 15px;"><strong>To:</strong> ' + selectedDest.name + '</div>';
            html += '<div class="warning">' +
                   '⚠️ <strong>Turn-by-turn unavailable</strong><br><br>' +
                   'OSRM routing service is blocked. Showing estimated distance based on road calculations.<br><br>' +
                   'For exact directions: Use Google Maps or GPS navigation.' +
                   '</div>';
            html += '</div>';

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').classList.add('show');
        }

        function showStatus(message, type) {
            var status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        // Clear button
        document.getElementById('clearBtn').addEventListener('click', function() {
            selectedOrigin = null;
            selectedDest = null;
            document.getElementById('origin').value = '';
            document.getElementById('dest').value = '';
            document.getElementById('originName').value = '';
            document.getElementById('destName').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('status').style.display = 'none';
        });

        console.log('✅ Mobile Router Ready!');
        console.log('Try codes: 01, 23, 40, 979');
    </script>
</body>
</html>
