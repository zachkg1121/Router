<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Chopper Truck Router</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            font-size: 16px;
        }
        h1 {
            color: #ff6b35;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            color: #f7b801;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .code-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .code-input {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button.secondary { background: #555; }
        .status {
            text-align: center;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            display: none;
        }
