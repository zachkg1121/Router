        .stat { display: flex; justify-content: space-between; margin: 6px 0; font-size: 12px; }
        .stat-value { color: #f7b801; font-weight: 600; }
        .loading { text-align: center; color: #f7b801; padding: 10px; font-size: 12px; }
        .directions::-webkit-scrollbar { width: 4px; }

        .toggle-icon { display: none; }

        function latLngToXY(lat, lng) { const scale = Math.pow(2, zoom) * 256 / (2 * Math.PI); return { x: (lng - centerLng) * scale * Math.cos(centerLat * Math.PI / 180) + canvas.width / 2, y: (centerLat - lat) * scale + canvas.height / 2 }; }
        async function loadMapTile(x, y, z) { const key = `${z}/${x}/${y}`; if (mapTiles[key]) return mapTiles[key]; const img = new Image(); img.crossOrigin = 'anonymous'; img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`; return new Promise((resolve) => { img.onload = () => { mapTiles[key] = img; resolve(img); }; img.onerror = () => resolve(null); }); }
        async function draw() { ctx.fillStyle = '#e5e3df'; ctx.fillRect(0, 0, canvas.width, canvas.height); const z = Math.floor(zoom); const tilesNeeded = 3; const centerTileX = Math.floor((centerLng + 180) / 360 * Math.pow(2, z)); const centerTileY = Math.floor((1 - Math.log(Math.tan(centerLat * Math.PI / 180) + 1 / Math.cos(centerLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z)); for (let tx = centerTileX - tilesNeeded; tx <= centerTileX + tilesNeeded; tx++) { for (let ty = centerTileY - tilesNeeded; ty <= centerTileY + tilesNeeded; ty++) { const tile = await loadMapTile(tx, ty, z); if (tile) { const tileLat = Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / Math.pow(2, z)))) * 180 / Math.PI; const tileLng = tx / Math.pow(2, z) * 360 - 180; const pos = latLngToXY(tileLat, tileLng); ctx.drawImage(tile, pos.x, pos.y, 256, 256); }}} if (currentRoute && currentRoute.path) { ctx.strokeStyle = '#ff6b35'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 4; ctx.beginPath(); currentRoute.path.forEach((point, i) => { const pos = latLngToXY(point[0], point[1]); if (i === 0) ctx.moveTo(pos.x, pos.y); else ctx.lineTo(pos.x, pos.y); }); ctx.stroke(); ctx.shadowBlur = 0; } const whPos = latLngToXY(WH.lat, WH.lng); ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(whPos.x, whPos.y, 14, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('WH', whPos.x, whPos.y + 4); Object.keys(stores).forEach(code => { const store = stores[code]; const pos = latLngToXY(store.lat, store.lng); ctx.fillStyle = '#ff6b35'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(code, pos.x, pos.y + 3); }); }
        async function calculateRoute() { const fromCode = document.getElementById('fromStore').value.trim().padStart(2, '0'); const toCode = document.getElementById('toStore').value.trim().padStart(2, '0'); if (!stores[fromCode] || !stores[toCode]) { alert('Invalid store codes'); return; } const from = stores[fromCode], to = stores[toCode]; document.getElementById('directions').innerHTML = '<div class="loading">🚛 Calculating...</div>'; try { const url = `https://valhalla1.openstreetmap.de/route?json={"locations":[{"lat":${from.lat},"lon":${from.lng}},{"lat":${to.lat},"lon":${to.lng}}],"costing":"truck","costing_options":{"truck":{"height":4.0,"width":2.6,"weight":26.0}}}`; const response = await fetch(url); const data = await response.json(); if (data.trip && data.trip.legs && data.trip.legs[0]) { const leg = data.trip.legs[0]; const miles = (leg.summary.length * 0.621371).toFixed(1); const mins = Math.round(leg.summary.time / 60); const path = decodePolyline(leg.shape); currentRoute = {from, to, path}; let html = `<div style="font-weight:600;margin-bottom:8px;color:#2ecc71;">✅ Route Found</div><div class="stat"><span>From:</span><span class="stat-value">${from.name} (#${fromCode})</span></div><div class="stat"><span>To:</span><span class="stat-value">${to.name} (#${toCode})</span></div><div class="stat"><span>Distance:</span><span class="stat-value">${miles} mi</span></div><div class="stat"><span>Time:</span><span class="stat-value">~${mins} min</span></div><div style="margin-top:12px;font-weight:600;color:#f7b801;font-size:11px;">Turn-by-Turn:</div>`; leg.maneuvers.forEach(m => { html += `<div class="direction-item">${m.instruction}</div>`; }); document.getElementById('directions').innerHTML = html; const bounds = path.reduce((b, p) => ({ minLat: Math.min(b.minLat, p[0]), maxLat: Math.max(b.maxLat, p[0]), minLng: Math.min(b.minLng, p[1]), maxLng: Math.max(b.maxLng, p[1]) }), {minLat: 90, maxLat: -90, minLng: 180, maxLng: -180}); centerLat = (bounds.minLat + bounds.maxLat) / 2; centerLng = (bounds.minLng + bounds.maxLng) / 2; draw(); } else throw new Error('No route'); } catch (error) { document.getElementById('directions').innerHTML = '<div style="color:#e74c3c;font-size:12px;">⚠️ Routing unavailable</div>'; }}
        function clearRoute() { currentRoute = null; document.getElementById('fromStore').value = ''; document.getElementById('toStore').value = ''; document.getElementById('directions').innerHTML = ''; centerLat = 42.8; centerLng = -73.8; zoom = 8; draw(); }
        function decodePolyline(str) { const coords = []; let lat = 0, lng = 0, index = 0; while (index < str.length) { let b, shift = 0, result = 0; do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20); lat += (result & 1) ? ~(result >> 1) : (result >> 1); shift = 0; result = 0; do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20); lng += (result & 1) ? ~(result >> 1) : (result >> 1); coords.push([lat / 1e6, lng / 1e6]); } return coords; }
        let isDragging = false, lastX, lastY;
        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) { const dx = e.clientX - lastX, dy = e.clientY - lastY; const scale = Math.pow(2, zoom) * 256 / (2 * Math.PI); centerLng -= dx / (scale * Math.cos(centerLat * Math.PI / 180)); centerLat += dy / scale; lastX = e.clientX; lastY = e.clientY; draw(); }});
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom += e.deltaY < 0 ? 0.2 : -0.2; zoom = Math.max(7, Math.min(16, zoom)); draw(); });
        let touchStart = null;
        canvas.addEventListener('touchstart', (e) => { touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; });
        canvas.addEventListener('touchmove', (e) => { if (touchStart) { e.preventDefault(); const dx = e.touches[0].clientX - touchStart.x, dy = e.touches[0].clientY - touchStart.y; const scale = Math.pow(2, zoom) * 256 / (2 * Math.PI); centerLng -= dx / (scale * Math.cos(centerLat * Math.PI / 180)); centerLat += dy / scale; touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; draw(); }});
        canvas.addEventListener('touchend', () => touchStart = null);
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => { resizeCanvas(); console.log('✅ Price Chopper Truck Router'); console.log('📍 128 stores loaded'); });
    </script>
