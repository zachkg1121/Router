<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router - Debug Version</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
        }
        h1 { color: #ff6b35; margin-bottom: 20px; text-align: center; }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button.add { background: #2ecc71; }
        button.secondary { background: #555; }
        .stop-label {
            color: #f7b801;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
    </style>
</head>
<body>
    <h1>🚛 Router - Test Version</h1>

```
<div class="card">
    <div id="stopsList">
        <div class="stop-label">STOP 1</div>
        <input type="text" id="stop1" placeholder="Enter store code (e.g., 23)" maxlength="3">
        
        <div class="stop-label">STOP 2</div>
        <input type="text" id="stop2" placeholder="Enter store code (e.g., 111)" maxlength="3">
        
        <div class="stop-label">STOP 3</div>
        <input type="text" id="stop3" placeholder="Enter store code (optional)" maxlength="3">
    </div>
    
    <button onclick="calculateRoute()">Calculate Route</button>
    <button class="secondary" onclick="clearAll()">Clear All</button>
</div>

<div id="results" style="background: #2a2a2a; padding: 20px; border-radius: 12px; margin-top: 15px; display: none;"></div>

<script>
    alert('Debug version loaded! Can you see this alert?');
    
    function calculateRoute() {
        alert('Calculate button clicked!');
        var stop1 = document.getElementById('stop1').value.trim();
        var stop2 = document.getElementById('stop2').value.trim();
        
        if (!stop1 || !stop2) {
            alert('Please enter at least 2 stores!');
            return;
        }
        
        document.getElementById('results').innerHTML = 
            '<h2>Route calculated!</h2>' +
            '<p>Stop 1: ' + stop1 + '</p>' +
            '<p>Stop 2: ' + stop2 + '</p>';
        document.getElementById('results').style.display = 'block';
    }
    
    function clearAll() {
        document.getElementById('stop1').value = '';
        document.getElementById('stop2').value = '';
        document.getElementById('stop3').value = '';
        document.getElementById('results').style.display = 'none';
    }
    
    console.log('Script loaded successfully');
</script>
```

</body>
</html>
